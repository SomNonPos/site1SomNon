<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta author="SomNonPos">
  <meta description="игры, game, games">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/myau.png">
    <title>APAdE | Добавить игру</title>
    <link rel="stylesheet" href="style.css">
    <style>
li {
  list-style-type: none;
}
.atten {
  position: absolute;
  height: 35%;
  width: 50%;
  z-index: 10;
  background-color: #ff9a9a;
  top: 25%;
  left: 27.5%;
  display: block;
  border: 4px solid #ff0000;
  border-radius: 10px;
}
.atten::after {
  content: 'Данная функция в разработке';
  color: #101010;
  position: absolute;
  top: 35%;
  left: 27%;
  font-size: 25px;
}
.atten::before {
  content: 'Внимание!';
  color: #101010;
  position: absolute;
  top: 10%;
  left: 3%;
  font-size: 30px;
}
#attentionwin.open {
  transform: translateY(0%);
}
#attentionwin {
  transform: translateY(-1000%);
  transition: transform 0.1s ease-in-out;
}
#atten-ok {
  position:absolute;
  background-color: #aaffaa;
  border-radius: 10px;
  height 40%;
  width: 40%;
  bottom: 10%;
  left: 30%;
  cursor: pointer;
}
.btn-left-menu {
  position: absolute;
  cursor: pointer;
  left: 0;
  top: 3%;
  width: 5%;
  min-width: 50px;
  height: 10%;
  background: transparent;
  border: none;
  display: flex;
  flex-direction: column;
}
.btn-left-menu span {
  width: 100%;
  margin-top: 12%;
  height: 9%;
  background-color: #54e39e;
  border-radius: 25px;
}
.left-menu {
  position: fixed;
  background-color: #363636;
  height: 100%;
  width: 30%;
  left: 0;
  top: 0;
  z-index: 10;
  min-width: 350px;
}
.l-m-list {
  margin-top: 20%;
  margin-left: 4%;
  display: flex;
  align-items: center;
}
#left-menu-id {
  transform: translateX(-100%);
  transition: transform 0.3s ease-in-out;
}
#left-menu-id.open {
  transform: translateX(0%)
}
.text-l-m {
  text-align: center;
  text-decoration: none;
  margin-left: 10%;
  margin-top: 10%;
  color: #ffffff;
  font-size: 130%;
  border: 2px solid #ffffff;
  height: 10%;
  width: 200%;
  position: relative;
  display: block;
  line-height: 40%;
  background-color: #777777;
  cursor: pointer;
}
.close-left-menu-button {
  position: relative;
  background: transparent;
  border: none;
  width: 25%;
  height: 7.5%;
  cursor: pointer;
  margin-left: 75%;
}
.close-left-menu-button::before,
.close-left-menu-button::after {
  position: absolute;
  content: ' ';
  margin-top: 2%;
  height: 100%;
  width: 10%;
  background-color: #ff1010;
}
.close-left-menu-button::before {
  transform: rotate(45deg);
}
.close-left-menu-button::after {
  transform: rotate(-45deg);
}
.add-game-button {
  position: absolute;
  height: 17.5%;
  width: 20%;
  background-image: linear-gradient(135deg, #cd91ff, #79bef2, #8ba3b5, #d1d8de, #cd91ff);

  background-size: 200% auto;
  animation: shine 3s linear infinite;

  bottom: 5%;
  left: 4%;
  border-radius: 10px;
  cursor: pointer;
}
@keyframes shine {

  0% {

    background-position: 0% 50%;

  } 
  50% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0% 50%;
  }
}
.add-game-button::after {
  content: 'Добавить';
  position: absolute;
  left: 10%;
  height: 100%;
  width: 80%;
  color: #101010;
  font-size: 33px;
  top: 35%;
}
.game-name {
  height:10%;
  width: 80%;
  margin-top: 5%;
  left: 10%;
  border-radius: 30px;
  border-color: #ffffff;
  background-color: #414241;
  line-height: 1.5;
  padding: 7px 0px;
  padding-left: 20px;
  padding-right: 20px;
  font-size: 150%;
  resize: none;
}
.a-g-sett {
  position: absolute;
  height: 100%;
  width: 65%;
  top: 0;
  right: 0;
  padding-left: 5%;
  background-color: #414241;
}
.game-descr {
  height:30%;
  width:80%;
  margin-top: 5%;
  left: 10%;
  border-radius: 30px;
  border-color: #ffffff;
  background-color: #414241;
  line-height: 1.5;
  padding: 7px 0px;
  padding-left: 20px;
  padding-right: 20px;
  font-size: 150%;
  resize: none;
}
    </style>
</head>
<body>
  <button class = add-game-button id = add-game-confirm-button></button>
  <aside class = "left-menu" id = "left-menu-id">
    <button class = "close-left-menu-button" id = "close-l-m-b">
    </button>
    <ul class = "l-m-list">
      <li>
        <a class = "text-l-m" href = "add-game-index.html" style="margin-top: -10%;">
            <p>Добавить  игру</p>
        </a>
        <a class = "text-l-m" href = aindex.html>
            <p> Меню </p>
        </a>
        <a class = "text-l-m" href = settings.html>
            <p> Настройки </p>
        </a>
      </li>
    </ul>
  </aside>
    <button class = "btn-left-menu" id = "btn-left-menu-id">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </button>
  <div class = atten id = attentionwin>
    <button id = atten-ok class = attenok>
      <p> OK </p>
    </button>
  </div>
  <object class = "a-g-sett">
    <textarea class = "game-name" type="text" name="name-game" placeholder="Название..." required></textarea>
    <textarea class = "game-descr" type="text" name="descr-game" placeholder="Описание..."required></textarea>
  </object>
  <script src = "ascript.js" defer>
  </script>
</body>
</html>
