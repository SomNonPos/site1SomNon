<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta author="SomNonPos">
  <meta description="игры, game, games">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/myau.png">
    <title>APAdE | Clicker 3000</title>
    <link rel="stylesheet" href="style.css">
    <style>
ul {
  list-style-type: none;
}
.btn-left-menu {
  position: absolute;
  cursor: pointer;
  left: 0;
  top: 3%;
  width: 5%;
  min-width: 50px;
  height: 10%;
  background: transparent;
  border: none;
  display: flex;
  flex-direction: column;
}
.btn-left-menu span {
  width: 100%;
  margin-top: 12%;
  height: 9%;
  background-color: #54e39e;
  border-radius: 25px;
}
.left-menu {
  position: fixed;
  background-color: #363636;
  height: 100%;
  width: 30%;
  left: 0;
  top: 0;
  z-index: 10;
  min-width: 350px;
}
.l-m-list {
  margin-top: 20%;
  margin-left: 4%;
  display: flex;
  align-items: center;
}
#left-menu-id {
  transform: translateX(-100%);
  transition: transform 0.3s ease-in-out;
}
#left-menu-id.open {
  transform: translateX(0%)
}
.text-l-m {
  text-align: center;
  text-decoration: none;
  margin-left: 10%;
  margin-top: 10%;
  color: #ffffff;
  font-size: 130%;
  border: 2px solid #ffffff;
  height: 10%;
  width: 200%;
  position: relative;
  display: block;
  line-height: 40%;
  background-color: #777777;
  cursor: pointer;
}
.close-left-menu-button {
  position: relative;
  background: transparent;
  border: none;
  width: 25%;
  height: 7.5%;
  cursor: pointer;
  margin-left: 75%;
}
.close-left-menu-button::before,
.close-left-menu-button::after {
  position: absolute;
  content: ' ';
  margin-top: 2%;
  height: 100%;
  width: 10%;
  background-color: #ff1010;
}
.close-left-menu-button::before {
  transform: rotate(45deg);
}
.close-left-menu-button::after {
  transform: rotate(-45deg);
}
.window-game {
  position: absolute;
  background-color: #414241;
  height: 100%;
  width: 80%;
  left: 10%;
  top: 0;
}
.click {
  position: absolute;
  height: 20%;
  width: 80%;
  background-color: #514f80;
  bottom: 20%;
  left: 10%;
  cursor: pointer;
  border: 2px solid #a19dfa;
  border-radius: 25px;
}
.click p {
  font-size: 140%;
}
.click:active {
  transform: scale(0.95);
}
.balance {
  position: absolute;
  background-color: #313052;
  top: 10%;
  right: 10%;
  padding-right: 10px;
  padding-left: 4px;
  padding-top: 4px;
  padding-bottom: 4px;
  border-radius: 10px;
  color: #8e8cd1;
}
#upgradeclick {
  position: absolute;
  background-color: #ff9999;
  border-color: none;
  top: 50%;
  left: 20%;
  padding-right: 10px;
  padding-left: 4px;
  padding-top: 4px;
  padding-bottom: 4px;
  border-radius: 10px;
  cursor: pointer;
}
#upgradeclick::before {
  content: "Улучшить клик: ";
}
#upgradepersec {
  position: absolute;
  background-color: #ff9999;
  border-color: none;
  top: 50%;
  left: 40%;
  padding-right: 10px;
  padding-left: 4px;
  padding-top: 4px;
  padding-bottom: 4px;
  border-radius: 10px;
  cursor: pointer;
}
#upgradepersec::before {
  content: "Улучшить клик: ";
}
#restartgame {
  position: absolute;
  top: 5%;
  right: 2%;
}
.moneypersec {
  position: absolute;
  background-color: #313052;
  top: 10%;
  right: 20%;
  padding-right: 10px;
  padding-left: 4px;
  padding-top: 4px;
  padding-bottom: 4px;
  border-radius: 10px;
  color: #8e8cd1;
}
    </style>
</head>
<body>
  <aside class = "left-menu" id = "left-menu-id">
    <button class = "close-left-menu-button" id = "close-l-m-b">
    </button>
    <ul class = "l-m-list">
      <li>
        <a class = "text-l-m" href = "add-game-index.html" style="margin-top: -10%;">
            <p>Добавить  игру</p>
        </a>
        <a class = "text-l-m" href = aindex.html>
            <p> Меню </p>
        </a>
        <a class = "text-l-m" href = settings.html>
            <p> Настройки </p>
        </a>
      </li>
    </ul>
  </aside>
    <button class = "btn-left-menu" id = "btn-left-menu-id">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </button>
  <object class = "window-game">
    <div class = "balance" >Money: <span id = "moneyCount">0</span></div>
    <div class = "moneypersec" >Money per sec: <span id = "moneysec">0</span></div>
    <button id = "upgradeclick">0
    </button>
    <button id = "upgradepersec"><span id = "pricepersec">0</span> + В секунду за улучшение: <span id = moneypersec>0</span>
    </button>
    <button class = "click" id = "clickid">
      <p> Click per: <span id = upgrader>1</span></p>
    </button>
  </object>
  <button id = "restartgame"> Restart </button>
  <script src = "ascript.js" defer></script>
  <script>
      let addmoney = 1;
      let money = 0;
      let priceupgradeclic = 10;
      let pricepersec = 100;
      let persec = 0;
      let futpersec = 1;

      money = localStorage.getItem("savedMoney");
      money = Number(money);

      priceupgradeclic = localStorage.getItem("savedPriceupgradeclic");
      priceupgradeclic = Number(priceupgradeclic);

      addmoney = localStorage.getItem("savedAddmoney");
      addmoney = Number(addmoney);

      persec = localStorage.getItem("savedPerSec");
      persec = Number(persec);

      pricepersec = localStorage.getItem("savedPricePerSec");
      pricepersec = Number(pricepersec);

      futpersec = localStorage.getItem("savedFutpersec");
      futpersec = Number(futpersec);

      const upgradeclic = document.getElementById('upgradeclick');
      const clickb = document.getElementById('clickid');
      const moneycou = document.getElementById('moneyCount');
      const upgrade = document.getElementById('upgrader');
      const restart = document.getElementById('restartgame');
      const upgpersec = document.getElementById('pricepersec');
      const monepersec = document.getElementById('moneysec');
      const buttonupgpersec = document.getElementById('upgradepersec');
      const futurpersec = document.getElementById('moneypersec');

      futurpersec.textContent = futpersec;
      upgpersec.textContent = pricepersec;
      moneycou.textContent = money;
      upgrade.textContent = addmoney;
      upgradeclick.textContent = priceupgradeclic;
      monepersec.textContent = persec;

        const intpersec = setInterval(() => {
            money = money + persec;
            localStorage.setItem("savedMoney", money);
            moneycou.textContent = money;
        }, 1000);

        buttonupgpersec.addEventListener('click', function() {
            if (money >= pricepersec && persec >= 1) {
              money = money - pricepersec;
                pricepersec = pricepersec * 4;
                pricepersec = pricepersec - (pricepersec % 1);
                persec = persec * 2;
                persec = persec - (persec % 1);
                futpersec = (persec * 2) - persec;

                futurpersec.textContent = futpersec;
                monepersec.textContent = persec;
                upgpersec.textContent = pricepersec;

                localStorage.setItem("savedFutpersec", futpersec);
                localStorage.setItem("savedPerSec", persec);
                localStorage.setItem("savedPricePerSec", pricepersec);

        }   else if (money >= pricepersec && persec == 0)   {
              money = money - pricepersec;
                pricepersec = pricepersec * 4;
                pricepersec = pricepersec - (pricepersec % 1);
                persec++;
                futpersec = (futpersec * 2) - persec;

                futurpersec.textContent = futpersec;
                monepersec.textContent = persec;
                upgpersec.textContent = pricepersec;


                localStorage.setItem("savedFutpersec", futpersec);
                localStorage.setItem("savedPerSec", persec);
                localStorage.setItem("savedPricePerSec", pricepersec);
        }});

        clickb.addEventListener('click', function() {
            money = money + addmoney;

            moneycou.textContent = money;

            localStorage.setItem("savedMoney", money);
      });

        upgradeclic.addEventListener('click', function() {
          if (money >= priceupgradeclic) {
            money = money - priceupgradeclic;
            priceupgradeclic = priceupgradeclic * 3.5;
            priceupgradeclic = priceupgradeclic - (priceupgradeclic % 1)
            addmoney++;

            upgrade.textContent = addmoney;
            upgradeclic.textContent = priceupgradeclic;
            moneycou.textContent = money;

            localStorage.setItem("savedAddmoney", addmoney);
            localStorage.setItem("savedPriceupgradeclic", priceupgradeclic);
            localStorage.setItem("savedMoney", money);
      }});

        restart.addEventListener('click', function() {
          addmoney = 1;
          money = 0;
          priceupgradeclic = 10;
          persec = 0;
          pricepersec = 100;
          futpersec = 1;

          localStorage.setItem("savedAddmoney", addmoney);
          localStorage.setItem("savedPriceupgradeclic", priceupgradeclic);
          localStorage.setItem("savedMoney", money);
          localStorage.setItem("savedPerSec", persec);
          localStorage.setItem("savedPricePerSec", pricepersec);
          localStorage.setItem("savedFutpersec", futpersec)

          futurpersec.textContent = futpersec;
          monepersec.textContent = persec;
          moneycou.textContent = money;
          upgrade.textContent = addmoney;
          upgradeclick.textContent = priceupgradeclic;
          upgpersec.textContent = pricepersec;
      });

  </script>
</body>
</html>
